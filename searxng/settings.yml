use_default_settings: true

general:
  debug: false
  instance_name: "X1 Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "x1-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
