use_default_settings: true

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# Explicitly keep several independent general-web engines active. Individual
# engines may occasionally be throttled or CAPTCHA-blocked; SearXNG merges the
# engines that succeed so one provider cannot make current-fact lookup stale.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
