use_default_settings:
  engines:
    keep_only:
      - google
      - yandex
      - bing
      - startpage

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# Google and Yandex are the preferred SERP sources for OLYA. Bing and
# Startpage remain bounded fallbacks when the server IP is challenged or a
# primary engine is temporarily unavailable. Application-side circuit breakers
# prevent CAPTCHA/429 engines from delaying user answers.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 1.8
  max_request_timeout: 2.4
