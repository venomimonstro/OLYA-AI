use_default_settings: true

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# Production interactive search uses only engines that remain stable from the
# server IP. Engines that repeatedly trigger CAPTCHA/429/parser failures are
# disabled instead of being hammered by health checks and every user query.
engines:
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: google
    disabled: true
  - name: yandex
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: qwant
    disabled: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 2.2
  max_request_timeout: 3.0
