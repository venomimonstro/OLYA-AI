use_default_settings:
  engines:
    keep_only:
      - bing
      - startpage

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# Production interactive search is intentionally restricted to the two engines
# that remain usable from the server IP. keep_only prevents hidden default
# engines (Wikidata, Google CSE, etc.) from being queried by generic searches.
engines:
  - name: bing
    disabled: false
  - name: startpage
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 2.2
  max_request_timeout: 3.0
