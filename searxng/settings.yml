use_default_settings:
  engines:
    keep_only:
      - google
      - yandex
      - duckduckgo
      - bing

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - json

# Internal keyless metasearch. Google/Yandex are primary quality sources;
# DDG/Bing provide independent fallbacks. The app performs its own dedupe,
# relevance ranking and page verification after discovery.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

# 1.4s was too aggressive for Yandex/Google from a VPS and caused false
# zero-result searches. These limits remain bounded and only affect discovery.
outgoing:
  request_timeout: 3.5
  max_request_timeout: 5.0
