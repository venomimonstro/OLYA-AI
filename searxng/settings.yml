use_default_settings:
  engines:
    keep_only:
      - google
      - yandex
      - duckduckgo
      - bing

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - json

# One internal metasearch request only. Google/Yandex are retained for result
# quality when the server IP can access them; DDG and Bing provide keyless
# fallbacks. Application code takes at most TOP-5 results.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 1.4
  max_request_timeout: 1.8
