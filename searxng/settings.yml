use_default_settings:
  engines:
    keep_only:
      - google
      - yandex
      - bing
      - duckduckgo
      - startpage

general:
  debug: false
  instance_name: "OLYA Internal Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

# Google and Yandex stay the preferred SERP sources while healthy. Bing is the
# first fallback; DuckDuckGo and Startpage are bounded secondary fallbacks.
# Application-side circuit breakers prevent CAPTCHA/429 engines from delaying
# every user request.
engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false

server:
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  secret_key: "olya-internal-search-not-public"

ui:
  static_use_hash: true

outgoing:
  request_timeout: 1.6
  max_request_timeout: 2.2
