[project]
name = "x1-ai"
version = "0.35.0"
description = "Local-first CPU/RAM AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pypdf>=5.1,<6",
  "python-docx>=1.1,<2",
  "Pillow>=11,<13",
  "cryptography>=44,<47"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2"
]
image = [
  "diffusers>=0.35,<1",
  "transformers>=4.55,<6",
  "safetensors>=0.5,<1",
  "torch>=2.8,<3"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
