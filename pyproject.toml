[project]
name = "x1-ai"
version = "0.40.0"
description = "Local-first CPU/RAM AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "sqlalchemy==2.0.52",
  "psycopg[binary]==3.3.5",
  "alembic==1.19.2",
  "pypdf==5.9.0",
  "python-docx==1.2.0",
  "Pillow==12.3.0",
  "cryptography==46.0.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2"
]
image = [
  "diffusers>=0.35,<1",
  "transformers>=4.55,<6",
  "safetensors>=0.5,<1",
  "torch>=2.8,<3",
  "accelerate>=1.10,<2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
