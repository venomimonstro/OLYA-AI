[project]
name = "x1-ai"
version = "0.32.0"
description = "X1 local-first CPU/RAM AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pypdf>=5.9,<7",
  "python-docx>=1.1,<2",
  "pillow>=11,<13",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
image = ["diffusers>=0.35,<1", "transformers>=4.55,<6", "safetensors>=0.5,<1", "torch>=2.8,<3"]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
