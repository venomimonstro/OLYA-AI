services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: x1
      POSTGRES_USER: x1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - x1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x1 -d x1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  app:
    build:
      context: .
      args:
        X1_EXTRAS: ""
    restart: unless-stopped
    env_file: .env
    environment:
      X1_DATABASE_AUTO_CREATE_SCHEMA: "false"
      X1_DATABASE_URL: postgresql+psycopg://x1:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/x1
    ports:
      - "${X1_BIND_ADDRESS:-127.0.0.1}:${X1_PORT:-8000}:8000"
    volumes:
      - x1_data:/app/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M

  gate:
    profiles: ["gate"]
    build:
      context: .
      args:
        X1_EXTRAS: "dev"
    env_file: .env
    environment:
      X1_ENV: test
      X1_DATABASE_AUTO_CREATE_SCHEMA: "true"
      X1_DATABASE_URL: sqlite+pysqlite:///./data/release_gate.db
    command: ["python", "-m", "pytest", "-q"]
    volumes:
      - x1_data:/app/data
    deploy:
      resources:
        limits:
          memory: 1536M

  image-worker:
    profiles: ["images"]
    build:
      context: .
      args:
        X1_EXTRAS: "image"
    restart: unless-stopped
    env_file: .env
    environment:
      X1_DATABASE_AUTO_CREATE_SCHEMA: "false"
      X1_DATABASE_URL: postgresql+psycopg://x1:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/x1
    command: ["python", "-m", "scripts.image_worker", "--persistent"]
    volumes:
      - x1_data:/app/data
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4096M

  llama:
    profiles: ["inference"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/Qwen3.6-35B-A3B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${X1_DEEP_CONTEXT_TOKENS:-16384}"
      - -np
      - "1"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    expose:
      - "8080"

volumes:
  x1_pgdata:
  x1_data:
