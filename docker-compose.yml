services:
  db:
    image: postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      POSTGRES_DB: x1
      POSTGRES_USER: x1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - x1_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x1 -d x1"]
      interval: 10s
      timeout: 5s
      retries: 8
    deploy:
      resources:
        limits:
          memory: 1536M

  searxng:
    image: ghcr.io/searxng/searxng:2026.9.4-15b0c8ef3@sha256:4112d4864885b7ef2fe678b18839633ebbcd3272271ac67ca671e19ae193d773
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - x1_searx_cache:/var/cache/searxng
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/search?q=x1&format=json',timeout=5).read()"]
      interval: 20s
      timeout: 8s
      retries: 8
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 768M

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-worker
    restart: unless-stopped
    mem_limit: 384m
    environment:
      X1_SANDBOX_WORKER_TOKEN: ${X1_PROJECT_SANDBOX_WORKER_TOKEN:?Set X1_PROJECT_SANDBOX_WORKER_TOKEN in .env}
      X1_HOST_DATA_ROOT: ${X1_HOST_DATA_ROOT:?Set X1_HOST_DATA_ROOT in .env}
      X1_SANDBOX_MIRROR_DATA_ROOT: /app/data
      X1_SANDBOX_RUNTIME_IMAGE: ${X1_PROJECT_SANDBOX_IMAGE:-x1-sandbox:0.39}
      X1_SANDBOX_MAX_CONCURRENT_EXECUTIONS: ${X1_SANDBOX_MAX_CONCURRENT_EXECUTIONS:-1}
      X1_SANDBOX_MAX_ACTIVE_PREVIEWS: ${X1_SANDBOX_MAX_ACTIVE_PREVIEWS:-1}
      X1_SANDBOX_MAX_MEMORY_MB: ${X1_SANDBOX_MAX_MEMORY_MB:-2048}
      X1_SANDBOX_MAX_CPU: ${X1_SANDBOX_MAX_CPU:-1.0}
      X1_SANDBOX_MAX_PIDS: ${X1_SANDBOX_MAX_PIDS:-128}
      X1_SANDBOX_PREVIEW_TTL_SECONDS: ${X1_SANDBOX_PREVIEW_TTL_SECONDS:-900}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M

  document-worker:
    build:
      context: .
      dockerfile: Dockerfile.document-worker
    restart: unless-stopped
    mem_limit: 768m
    environment:
      X1_DOCUMENT_RENDER_WORKER_TOKEN: ${X1_DOCUMENT_RENDER_WORKER_TOKEN:?Set X1_DOCUMENT_RENDER_WORKER_TOKEN in .env}
      X1_DATA_ROOT: /app/data
      X1_DOCUMENT_MAX_CONCURRENT_RENDERS: ${X1_DOCUMENT_MAX_CONCURRENT_RENDERS:-1}
      X1_DOCUMENT_MAX_PAGES: ${X1_DOCUMENT_MAX_PAGES:-300}
      X1_DOCUMENT_MAX_RASTER_DPI: ${X1_DOCUMENT_RASTER_DPI:-110}
    volumes:
      - ./data:/app/data
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  app:
    build:
      context: .
      args:
        X1_EXTRAS: ""
    restart: unless-stopped
    mem_limit: 2048m
    env_file: .env
    environment:
      X1_DATABASE_AUTO_CREATE_SCHEMA: "false"
      X1_DATABASE_URL: postgresql+psycopg://x1:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/x1
      X1_DATA_ROOT: /app/data
      X1_SEARXNG_BASE_URL: http://searxng:8080
      X1_PROJECT_SANDBOX_WORKER_URL: http://sandbox-worker:8090
      X1_DOCUMENT_RENDER_BACKEND: remote
      X1_DOCUMENT_RENDER_WORKER_URL: http://document-worker:8091
    ports:
      - "${X1_BIND_ADDRESS:-127.0.0.1}:${X1_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
      sandbox-worker:
        condition: service_started
      document-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 2048M

  gate:
    profiles: ["gate"]
    build:
      context: .
      args:
        X1_EXTRAS: "dev"
    mem_limit: 1536m
    env_file: .env
    environment:
      X1_ENV: test
      X1_DATABASE_AUTO_CREATE_SCHEMA: "true"
      X1_DATABASE_URL: sqlite+pysqlite:///./data/release_gate.db
      X1_DATA_ROOT: /app/data
      X1_DOCUMENT_RENDER_BACKEND: local
    command: ["python", "-m", "pytest", "-q"]
    deploy:
      resources:
        limits:
          memory: 1536M

  image-worker:
    profiles: ["images"]
    build:
      context: .
      args:
        X1_EXTRAS: "image"
    restart: unless-stopped
    mem_limit: 4096m
    env_file: .env
    environment:
      X1_DATABASE_AUTO_CREATE_SCHEMA: "false"
      X1_DATABASE_URL: postgresql+psycopg://x1:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/x1
      X1_DATA_ROOT: /app/data
    command: ["python", "-m", "scripts.image_worker", "--persistent"]
    volumes:
      - ./data:/app/data
      - ./models:/models:ro
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4096M

  llama:
    profiles: ["inference"]
    image: ghcr.io/ggml-org/llama.cpp:server-b10380@sha256:683ad4c9569bdbd6b8d7ad008a729cf4f9a3dfaf9712c81a7ecac0c5b9a078fc
    restart: unless-stopped
    mem_limit: ${X1_LLAMA_MEMORY_LIMIT:-23g}
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/${X1_LLAMA_MODEL_FILE:-Qwen3.6-35B-A3B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "${X1_DEEP_CONTEXT_TOKENS:-8192}"
      - -np
      - "1"
      - -t
      - "${X1_LLAMA_THREADS:-8}"
      - -tb
      - "${X1_LLAMA_THREADS_BATCH:-8}"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 8s
      retries: 15
      start_period: 90s

volumes:
  x1_pgdata:
  x1_searx_cache:
